name: test

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Hs80.App is WPF (net10.0-windows), so only the core tests run here.
      - run: dotnet test Hs80.Core.Tests/Hs80.Core.Tests.csproj --nologo
